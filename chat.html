<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with AI Model</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #1a1a2e;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      padding: 20px;
    }
    #chatBox {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    #messages {
      min-height: 200px;
      margin-bottom: 15px;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #1a1a2e;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #333;
    }
  </style>
</head>
<body>
  <header>
    <h1>Chat with <span id="modelName">AI Model</span></h1>
  </header>
  <main>
    <div id="chatBox">
      <div id="messages"></div>
      <textarea id="userInput" placeholder="Say something..."></textarea>
      <button onclick="reply()">Send</button>
    </div>
  </main>
  <script>
    const modelParam = new URLSearchParams(window.location.search).get('model');
    const modelName = modelParam ? modelParam.toUpperCase() : 'AI Model';
    document.getElementById('modelName').textContent = modelName;

    async function reply() {
      const userInput = document.getElementById("userInput").value.trim();
      const messages = document.getElementById("messages");
      if (!userInput) return;

      messages.innerHTML += `<p><strong>You:</strong> ${userInput}</p>`;
      document.getElementById("userInput").value = '';

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "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"
          },
          body: JSON.stringify({
            model: "deepseek-chat",
            messages: [
              { role: "system", content: "You are a helpful assistant." },
              { role: "user", content: userInput }
            ]
          })
        });

        const data = await response.json();
        const aiReply = data.choices?.[0]?.message?.content || "(No reply)";
        messages.innerHTML += `<p><strong>${modelName}:</strong> ${aiReply}</p>`;
      } catch (err) {
        messages.innerHTML += `<p style='color:red'><strong>${modelName}:</strong> Error contacting model.</p>`;
        console.error(err);
      }
    }
  </script>
</body>
</html>
